<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- head:start (replaced per page at build time) -->
    <title>Nebula Atlas · Explore the cosmos</title>
    <meta name="description" content="An interactive atlas of the universe's most breathtaking nebulae." />
    <!-- head:end -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#05070f" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#eef1f8" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="32x32" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <!-- Apply the saved (or system) theme before first paint to avoid a flash. -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem('nebula-atlas:theme');
          var dark = t ? t === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches;
          d.classList.toggle('dark', dark);
          d.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6785729858179624"
     crossorigin="anonymous"></script>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <!-- noscript:start --><!-- noscript:end -->
    <div id="root">
      <div class="boot" role="status">
        <span class="boot-logo" aria-hidden="true"></span><span>Loading the cosmos…</span>
      </div>
    </div>
  </body>
</html>
